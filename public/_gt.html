<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#2B4E6B;display:flex;gap:0;font:12px monospace;color:#fff}
.box{width:250px;height:600px;position:relative;border-right:1px solid #fff3}
.box img{position:absolute;top:0;left:50%;width:230px;height:auto;translate:-50% 0}
.b2 img{filter:saturate(1.18) contrast(1.08) brightness(.97) drop-shadow(0 22px 34px rgba(13,71,161,.3))}
.b3 img{transform-origin:50% 55%;transform:scale(1.2)}
.b4 img{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 8%,#000 93%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 8%,#000 93%,transparent 100%)}
.lbl{position:absolute;bottom:4px;left:4px;z-index:9;background:#000a;padding:2px 4px}
</style></head><body>
<div class="box b1"><img src="/images/gate/floral-arch.webp"><span class="lbl">1 plain</span></div>
<div class="box b2"><img src="/images/gate/floral-arch.webp"><span class="lbl">2 filter</span></div>
<div class="box b3"><img src="/images/gate/floral-arch.webp"><span class="lbl">3 transform</span></div>
<div class="box b4"><img src="/images/gate/floral-arch.webp"><span class="lbl">4 mask</span></div>
</body></html>
